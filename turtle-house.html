<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Turtle House | Oisin's Coding Lab</title>

    <link rel="stylesheet" href="style.css">


    <!-- BRYTHON -->

    <script src="https://cdn.jsdelivr.net/npm/brython@3.14.1/brython.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/brython@3.14.1/brython_stdlib.js"></script>

</head>


<body onload="brython()">


<!-- NAV -->

<nav class="navbar">

    <a href="index.html" class="logo">
        <span>&lt;/&gt;</span>
        Oisin's Coding Lab
    </a>

    <a href="index.html" class="nav-link">
        ← Projects
    </a>

</nav>



<!-- TITLE -->

<header class="project-header">

    <div class="label">
        PROJECT 01 · PYTHON TURTLE
    </div>

    <h1>My Turtle House</h1>

    <p>
        Write Python code and watch your turtle draw.
    </p>

</header>



<!-- WORKSPACE -->

<main class="workspace">


    <!-- CODE -->

    <section class="editor">

        <div class="editor-bar">

            <span>
                oisin_house.py
            </span>

            <button onclick="runCode()">
                ▶ RUN
            </button>

        </div>


        <textarea id="code">from browser import document
import turtle

turtle.set_defaults(
    turtle_canvas_wrapper=document["turtle-div"]
)

t = turtle.Turtle()

t.speed(5)

# Draw the house

t.fillcolor("lightblue")
t.begin_fill()

for i in range(4):
    t.forward(150)
    t.left(90)

t.end_fill()

# Draw the roof

t.fillcolor("red")
t.begin_fill()

t.left(45)
t.forward(106)
t.left(90)
t.forward(106)
t.left(45)

t.end_fill()

turtle.done()
</textarea>

    </section>



    <!-- OUTPUT -->

    <section class="output">

        <div class="output-bar">

            <span>
                TURTLE OUTPUT
            </span>

            <button onclick="resetTurtle()">
                RESET
            </button>

        </div>


        <div id="turtle-div"></div>


        <div class="tip">

            <strong>Try changing the code.</strong>

            <span>
                Change a color, number, or direction
                and press RUN again.
            </span>

        </div>

    </section>


</main>



<script>

function runCode() {

    resetTurtle();

    const code =
        document.getElementById("code").value;


    try {

        brython({
            args: ["-c", code]
        });

    }

    catch(error) {

        showError(error);

    }

}


function resetTurtle() {

    document.getElementById("turtle-div").innerHTML = "";

}


function showError(error) {

    document.getElementById("turtle-div").innerHTML =

        `<div class="error">
            <strong>Something went wrong.</strong>
            <br><br>
            ${error}
        </div>`;

}

</script>



<style>

}

.editor-bar button {

    border: none;

    min-height: 650px;

</html>
